version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: minisplunk_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: minisplunk_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: minisplunk_redis
    ports:
      - "6379:6379"
    volumes:
      - pgdata:/var/lib/redis/data

volumes:
  pgdata: